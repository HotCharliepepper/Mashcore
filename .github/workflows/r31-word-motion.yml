name: R3.1 Word Motion QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'assets/r31/**'
      - 'index.html'
      - 'mobile/**'
      - 'scripts/**'
      - 'qa/r31_word_motion.py'
      - '.github/workflows/r31-word-motion.yml'
permissions:
  contents: read
concurrency:
  group: r31-words-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  words-and-regressions:
    if: startsWith(github.head_ref, 'codex/r31-word-motion-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve source and release boundaries in every context
        run: |
          python scripts/check_site.py
          python scripts/test_r31_boundary.py
          for context in production branch-deploy deploy-preview; do
            python scripts/prepare_public.py --context "$context"
            python scripts/check_release.py --context "$context"
            python scripts/check_word_motion.py
          done
          node --check assets/r31/word-motion.js
      - name: Retained inquiry, navigation and spatial controls
        run: |
          npm install --prefix "$RUNNER_TEMP/words-qa" --no-audit --no-fund linkedom@0.18.12
          NODE_PATH="$RUNNER_TEMP/words-qa/node_modules" node scripts/check_interactions.cjs
          NODE_PATH="$RUNNER_TEMP/words-qa/node_modules" node scripts/check_spatial.cjs
      - name: Install browser QA dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Inspect this exact revision on Netlify Deploy Preview
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--mashcore.netlify.app/
          QA_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python qa/r31_word_motion.py
      - name: Keep screenshots and measured results outside the publish artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r31-word-motion-${{ github.event.pull_request.head.sha }}
          path: qa/r31-word-evidence/
          retention-days: 30
          if-no-files-found: warn
