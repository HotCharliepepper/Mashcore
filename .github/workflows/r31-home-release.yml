name: MASHCORE R3.1 Legacy QA (historical release branches only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'experiments/r31-origin-research/**'
      - 'qa/r31_browser.py'
      - '.github/workflows/r31-home-release.yml'
permissions:
  contents: read
jobs:
  historical-only:
    if: startsWith(github.head_ref, 'release/r31-home-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Keep historical R3.1 source available for review
        run: test -f qa/r31_browser.py
