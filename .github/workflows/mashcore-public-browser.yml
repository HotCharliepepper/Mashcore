name: MASHCORE Public-Safe Browser QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/mashcore-public-browser.yml'
      - 'qa/public_live_browser.py'
      - 'scripts/**'
      - 'assets/**'
      - 'index.html'
      - 'mobile/**'
      - 'research/**'
      - 'services/**'
      - 'about/**'
      - 'explore/**'
      - 'policies/**'
      - 'work/**'
      - 'signal-studio/**'
      - 'netlify.toml'

permissions:
  contents: read

concurrency:
  group: mashcore-public-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-safe-browser-review:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect current PR10 Netlify Preview
        env:
          PREVIEW_URL: https://deploy-preview-10--mashcore.netlify.app/
          QA_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python qa/public_live_browser.py
      - name: Upload visual and machine QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mashcore-live-safe-browser-${{ github.event.pull_request.head.sha }}
          path: qa/public-evidence/
          if-no-files-found: warn
          retention-days: 14
