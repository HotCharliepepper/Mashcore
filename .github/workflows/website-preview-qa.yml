name: MASHCORE Draft Preview Browser QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/website-preview-qa.yml'
      - 'qa/website_draft_browser.py'
      - 'scripts/**'
      - 'content/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'index.html'
      - 'research/**'
      - 'services/**'
      - 'about/**'
      - 'work/**'
      - 'policies/**'
      - 'netlify.toml'

permissions:
  contents: read

concurrency:
  group: mashcore-draft-browser-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-preview-browser:
    if: github.event.pull_request.number == 9
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect actual deploy preview, no client actions
        env:
          PREVIEW_URL: https://deploy-preview-9--mashcore.netlify.app/
          QA_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python qa/website_draft_browser.py
      - name: Keep screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mashcore-pr9-browser-qa-${{ github.event.pull_request.head.sha }}
          path: qa/browser-evidence/
          if-no-files-found: warn
          retention-days: 14
