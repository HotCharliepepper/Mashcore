name: MASHCORE Current Release Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'mobile/**'
      - 'about/**'
      - 'contact/**'
      - 'explore/**'
      - 'market-notes/**'
      - 'research/**'
      - 'services/**'
      - 'work/**'
      - 'signal-studio/**'
      - 'policies/**'
      - 'scripts/**'
      - 'qa/a20_browser_qa.py'
      - 'qa/current_release_browser.py'
      - 'docs/release-provenance.md'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.gitattributes'
      - 'netlify.toml'
      - '.github/workflows/a20-release.yml'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mashcore-current-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-public-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source checks and reproducible static release
        run: |
          python3 scripts/release_lock.py --check
          python3 scripts/prepare_public.py --context production
          python3 scripts/check_release.py --context production
          python3 scripts/prepare_public.py --context deploy-preview
          python3 scripts/check_release.py --context deploy-preview
          python3 scripts/prepare_public.py --context branch-deploy
          python3 scripts/check_release.py --context branch-deploy
          python3 scripts/prepare_public.py --context production
          python3 scripts/check_release.py --context production
          python3 scripts/release_lock.py --check --context production
      - name: Browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Check all 19 routes on desktop and mobile (local build)
        run: python3 qa/a20_browser_qa.py
      - name: Check current Interlude, VALUE FLOW, HUMAN, FIELD and inquiry interactions
        run: python3 qa/current_release_browser.py
